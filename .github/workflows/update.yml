name: 更新储能中标数据

on:
  schedule:
    # 每周一、三、五 UTC 0:00（北京时间上午8:00）自动运行
    - cron: '0 0 * * 1,3,5'
  workflow_dispatch:   # 允许手动触发

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r scraper/requirements.txt

      - name: 运行爬虫
        run: python scraper/scrape.py

      - name: 提交更新
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "自动更新数据" && git push)
