<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2025年至今大型储能招标结果</title>
  <style>
    body { font-family: "Microsoft YaHei", sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 10px 8px; }
    th { background: #2c3e50; color: white; }
    tr:nth-child(even) { background: #f9f9f9; }
    tr:hover { background: #f1f1f1; }
    a { color: #2980b9; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .footer { margin-top: 30px; color: #888; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <h1>🔋 大型储能中标公示（2025年至今）</h1>
  <p>数据来源：北极星储能网，每周一、三、五自动更新</p>
  <table id="bidTable">
    <thead>
      <tr>
        <th>公告标题</th>
        <th>中标单位</th>
        <th>中标金额</th>
        <th>参与投标单位</th>
        <th>发布日期</th>
        <th>详情</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="6" style="text-align:center;">数据加载中...</td></tr>
    </tbody>
  </table>
  <div class="footer">自动更新于 <span id="updateTime"></span></div>

  <script>
    fetch('data.json')
      .then(response => response.json())
      .then(data => {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">暂无数据，等待首次抓取</td></tr>';
          return;
        }
        data.forEach(item => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${item.title || ''}</td>
            <td>${item.winner || ''}</td>
            <td>${item.amount || ''}</td>
            <td>${(item.participants || []).join('、') || '未列出'}</td>
            <td>${item.date || ''}</td>
            <td><a href="${item.link || '#'}" target="_blank">查看原文</a></td>
          `;
          tbody.appendChild(row);
        });
        document.getElementById('updateTime').textContent = new Date().toLocaleString();
      })
      .catch(err => {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">数据加载失败，请检查 data.json 是否存在</td></tr>';
        console.error(err);
      });
  </script>
</body>
</html>
